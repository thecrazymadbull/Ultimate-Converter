name: Build UltimateConverter.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up ffmpeg
        id: setup-ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          linking-type: static

      - name: Copy ffmpeg next to the app
        shell: pwsh
        run: Copy-Item (Get-Command ffmpeg).Source -Destination ffmpeg.exe

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "UltimateConverter"
          --icon "icon.ico"
          --add-binary "ffmpeg.exe;."
          --add-data "icon.ico;."
          --collect-data "tkinterdnd2"
          main.py

      - name: Upload the built exe
        uses: actions/upload-artifact@v7
        with:
          name: UltimateConverter-windows
          path: dist/UltimateConverter.exe
