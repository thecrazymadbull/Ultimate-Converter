name: Build APK and publish downloads

# Builds the Android APK, waits for the Windows build of the same commit,
# then puts BOTH files on the Releases page.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-downloads
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show what went wrong
        if: failure()
        run: |
          log="$RUNNER_TEMP/build.log"
          errs=$(grep -E '^e: ' "$log" | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -40 || true)
          if [ -z "$errs" ]; then errs=$(grep -A8 'What went wrong' "$log" | head -30 || true); fi
          { echo '### Android build errors'; echo; echo '```'; echo "$errs"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          msg=$(echo "$errs" | head -20 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Android build errors::$msg"

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: UltimateConverter-android
          path: android/app/build/outputs/apk/debug/*.apk

  publish:
    needs: android
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Get the APK
        uses: actions/download-artifact@v4
        with:
          name: UltimateConverter-android
          path: dl/apk

      - name: Wait for the Windows build of this commit
        run: |
          for i in $(seq 1 120); do
            pending=$(gh run list --repo "$REPO" --commit "$SHA" --limit 50 --json databaseId,status \
              --jq '[.[] | select(.databaseId != '"$RUN_ID"') | select(.status != "completed")] | length')
            echo "other builds still running: $pending"
            if [ "$pending" = "0" ]; then break; fi
            sleep 15
          done

      - name: Get the Windows exe
        run: |
          gh run list --repo "$REPO" --commit "$SHA" --limit 50 --json databaseId,conclusion \
            --jq '.[] | select(.conclusion == "success") | select(.databaseId != '"$RUN_ID"') | .databaseId' > ids.txt
          echo "finished builds:"; cat ids.txt
          while read -r id; do
            gh run download "$id" --repo "$REPO" --dir "dl/$id" || true
          done < ids.txt
          find dl -type f

      - name: Put both on the Releases page
        run: |
          mkdir -p out
          exe=$(find dl -type f -iname '*.exe' | head -n 1)
          apk=$(find dl -type f -iname '*.apk' | head -n 1)
          if [ -n "$exe" ]; then cp "$exe" out/UltimateConverter.exe; fi
          if [ -n "$apk" ]; then cp "$apk" out/UltimateConverter.apk; fi
          ls -l out
          if [ -z "$(ls -A out)" ]; then echo "Nothing to publish"; exit 1; fi

          notes="Newest build: commit ${SHA:0:7}. UltimateConverter.exe is for Windows, UltimateConverter.apk is for Android."
          if gh release view latest --repo "$REPO" > /dev/null 2>&1; then
            gh release edit latest --repo "$REPO" --notes "$notes" --latest
          else
            gh release create latest --repo "$REPO" --target "$SHA" \
              --title "Ultimate Converter - latest downloads" --notes "$notes" --latest
          fi
          gh release upload latest out/* --repo "$REPO" --clobber
